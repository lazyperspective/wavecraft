 const beat=60/88,lead=Math.max(...lanes.map(l=>l.total))+1.1;let musicalTime=0;

 }
 function updateVolume(){if(master)master.gain.setTargetAtTime(muted?0:Number($('volume').value)*.68,audio.currentTime,.04);}

 // Reusable marble pool: no geometry or material allocation during performance.

 function spawn(e,cycle){const ball=pool.find(b=>!b.active);if(!ball)return;Object.assign(ball,{active:true,event:e,cycle,born:cycle*cycleLength+e.release,hit:false,phase:'rail',restAge:0,vy:0,vz:0,age:0,impacts:0});ball.group.visible=true;ball.group.scale.setScalar(1);ball.group.rotation.set(0,0,0);balls.push(ball);}
 function strike(b){b.hit=true;b.phase='fall';const bar=bars[b.event.note],lane=lanes[b.event.note];b.group.position.copy(lane.contact);b.vy=1.1;b.vz=2.6;b.vx=(b.event.note-3.5)*.012;bar.energy=1;bar.age=0;ringNote(b.event.note,.94+rand()*.06);const idx=b.event.index;dots.forEach((d,i)=>{const j=idx%30;d.className=i===j?'active':i<j?'past':'';});$('note').textContent=names[b.event.note]+(b.event.note===7?'5':'4');$('phrase').textContent='PHRASE '+(idx<15?'I':idx<30?'II':idx<46?'III':'IV')+' · '+(b.cycle+1).toString().padStart(2,'0');}
 function trackState(lane,age){const a=lane.trajectory;const k=clamp(Math.floor(age*240),0,a.length-2),p=a[k],q=a[k+1],f=clamp((age-p.time)/(q.time-p.time),0,1);const s=lerp(p.s,q.s,f);return {p:lane.curve.getPointAt(clamp(s/lane.length,0,1)).add(V(0,.111,0)),speed:lerp(p.v,q.v,f),s};}
 let started=false,playing=false,sim=0,nextCycle=0,nextEvent=0,lastStamp=0,accum=0,realElapsed=0;
 const releases=[...events].sort((a,b)=>a.release-b.release);
 // The score only opens gates. Balls own all collisions and trigger the audio.
 function simulate(dt){sim+=dt;
   while(sim>=nextCycle*cycleLength+releases[nextEvent].release){spawn(releases[nextEvent],nextCycle);if(++nextEvent===releases.length){nextEvent=0;nextCycle++;}}
   for(let i=balls.length-1;i>=0;i--){const b=balls[i],lane=lanes[b.event.note],age=sim-b.born;b.age=age;
     if(b.phase==='rail'){
       if(age<=lane.rollTime){const state=trackState(lane,age);b.group.position.copy(state.p);const direction=lane.curve.getTangentAt(clamp(state.s/lane.length,0,1));const axis=V(direction.z,0,-direction.x).normalize();b.group.quaternion.setFromAxisAngle(axis,state.s/radius);}
       else if(age<lane.total){const t=age-lane.rollTime;b.group.position.copy(lane.end).addScaledVector(lane.velocity,t).add(V(0,-4.9*t*t,0));}
       else strike(b);
     } else if(b.phase==='fall'){
       const p=b.group.position,oldY=p.y; b.vy-=9.8*dt;p.x+=b.vx*dt;p.y+=b.vy*dt;p.z+=b.vz*dt;b.group.rotation.x+=b.vz/radius*dt;
       const bar=bars[b.event.note],barEdge=1.57+bar.len/2;
       if(b.vy<0&&oldY>=1.315+radius&&p.y<1.315+radius&&p.z<barEdge-.025){p.y=1.315+radius;b.vy=Math.abs(b.vy)*.27;b.vz*=.94;b.impacts++;bar.energy=Math.max(bar.energy,.14);}
       if(p.y<.686+radius&&b.vy<0){p.y=.686+radius;b.vy=Math.abs(b.vy)*.23;b.vz*=.62;if(Math.abs(b.vy)<.14){b.phase='rest';b.vy=0;}}
       if(p.z>2.77-radius){p.z=2.77-radius;b.vz=-Math.abs(b.vz)*.25;}
       if(p.z<2.2+radius&&p.y<.9){p.z=2.2+radius;b.vz=Math.abs(b.vz)*.2;}
     } else {
       b.restAge+=dt;const p=b.group.position;p.z+=b.vz*dt;b.vz*=Math.exp(-dt*5);b.group.rotation.x+=b.vz/radius*dt;p.z=clamp(p.z,2.2+radius,2.77-radius);
       // A felt-covered return slot closes around a resting marble. Fading is
       // below the rail lip, so the collection never fills or resets abruptly.
       if(b.restAge>3.4){p.y-=dt*.1;const k=Math.max(0,1-(b.restAge-3.4)/1.8);b.group.scale.setScalar(k);if(k<=0){b.active=false;b.group.visible=false;balls.splice(i,1);}}
     }
   }

   for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];if(a.phase==='rail'||b.phase==='rail'||a.group.position.y>.88||b.group.position.y>.88)continue;const d=a.group.position.clone().sub(b.group.position);d.y=0;const len=d.length(),rr=radius*(a.group.scale.x+b.group.scale.x);if(len>1e-5&&len<rr){d.multiplyScalar((rr-len)/len*.5);a.group.position.add(d);b.group.position.sub(d);a.vz*=.7;b.vz*=.7;}}
   wheel.rotation.z-=dt*.22;
   for(let i=0;i<8;i++){const lane=lanes[i],recent=balls.find(b=>b.event.note===i&&b.age<.27);const opening=recent?Math.sin(Math.min(recent.age/.27,1)*Math.PI):0;lane.gate.position.x=lane.sx+opening*.21;for(let k=0;k<2;k++)lane.beads[k].position.y=4.19+k*.26-Math.sin(opening*Math.PI/2)*.08;}
 }
 let theta=.28,targetTheta=.28,elevation=.36,targetElevation=.36,orbit=!reduced,drag=false,lastX=0,lastY=0;
 $('orbit').setAttribute('aria-pressed',String(orbit));
 
 renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});

 $('mute').onclick=()=>{muted=!muted;updateVolume();$('mute').setAttribute('aria-pressed',String(muted));$('mute').setAttribute('aria-label',muted?'Unmute sound':'Mute sound');$('sound-icon').innerHTML=muted?'<path d="m11 5-6 5H2v4h3l6 5zM16 9l6 6M22 9l-6 6"/>':'<path d="m11 5-6 5H2v4h3l6 5zM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14"/>';};
 $('volume').oninput=updateVolume;
 async function setPlaying(value){if(value)try{await initAudio();}catch(e){$('state').textContent='AUDIO UNAVAILABLE';return;}
   if(value&&!started){started=true;document.body.classList.add('started');$('pause').disabled=false;}
   playing=value;document.body.classList.toggle('playing',playing);$('state').textContent=playing?'IN MOTION':'PAUSED';$('pause').setAttribute('aria-label',playing?'Pause performance':'Resume performance');$('pause-icon').innerHTML=playing?'<path d="M8 5v14M16 5v14"/>':'<path d="m8 5 11 7-11 7z"/>';
   if(audio){if(value){await audio.resume();updateVolume();}else await audio.suspend();}accum=0;
 }
 $('begin').onclick=()=>setPlaying(true);$('pause').onclick=()=>setPlaying(!playing);
 document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlaying(!playing);}});
 // Hidden tabs pause both the mechanism and its audio clock; no catch-up burst.
 let wasPlaying=false;document.addEventListener('visibilitychange',()=>{if(document.hidden){wasPlaying=playing;if(playing)setPlaying(false);}else if(wasPlaying){wasPlaying=false;setPlaying(true);}});
 function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));}addEventListener('resize',resize);
 const step=1/120;
 function render(stamp){requestAnimationFrame(render);const dt=Math.min(lastStamp?(stamp-lastStamp)/1000:0,.08);lastStamp=stamp;realElapsed+=dt;
   if(playing){accum+=dt;while(accum>=step){simulate(step);accum-=step;}}
   for(const b of bars){if(playing)b.age+=dt;b.energy*=Math.exp(-dt*5.5);b.mat.emissiveIntensity=b.energy*.8;b.group.rotation.x=reduced?0:Math.sin(b.age*75)*b.energy*.018;b.group.position.y=1.27+Math.sin(b.age*92)*b.energy*.009;b.halo.material.opacity=Math.max(0,1-b.age/.65)*.34;b.halo.scale.setScalar(1+b.age*1.2);}
   if(started&&orbit&&!drag)targetTheta+=dt*.032;theta=lerp(theta,targetTheta,1-Math.exp(-dt*4));elevation=lerp(elevation,targetElevation,1-Math.exp(-dt*4));
