<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass &amp; Brass — A Musical Marble Machine</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0d0b;
      color: #efe5d5;
      font-family: Georgia, "Times New Roman", serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Minimal invitation overlay */
    #intro-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: clamp(48px, 9vh, 96px);
      background: radial-gradient(circle at 50% 45%, rgba(15, 13, 11, 0.08) 0%, rgba(15, 13, 11, 0.58) 100%);
      z-index: 20;
      cursor: pointer;
      transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1), visibility 1.1s;
    }

    #intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-card {
      text-align: center;
      padding: 20px 32px;
      border-radius: 999px;
      background: rgba(20, 17, 14, 0.55);
      border: 1px solid rgba(212, 168, 83, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transition: transform 0.35s ease, border-color 0.35s ease;
    }

    #intro-overlay:hover .intro-card {
      transform: translateY(-2px);
      border-color: rgba(212, 168, 83, 0.5);
    }

    .intro-title {
      font-size: clamp(1.35rem, 2.5vw, 1.85rem);
      font-weight: normal;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f3e6cf;
      margin-bottom: 6px;
    }

    .intro-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(226, 198, 142, 0.85);
    }

    /* Subtle corner HUD once playing */
    #hud {
      position: fixed;
      bottom: 22px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    #hud.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .hud-btn {
      appearance: none;
      background: rgba(22, 18, 15, 0.62);
      border: 1px solid rgba(212, 168, 83, 0.24);
      color: #e9dcc6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .hud-btn:hover {
      background: rgba(38, 30, 23, 0.82);
      border-color: rgba(212, 168, 83, 0.55);
      color: #fff6e6;
    }

    #note-caption {
      position: fixed;
      bottom: 24px;
      left: 26px;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      color: rgba(232, 214, 184, 0.52);
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #note-caption.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="intro-overlay" role="button" tabindex="0" aria-label="Start the musical marble machine">
    <div class="intro-card">
      <div class="intro-title">Glass &amp; Brass</div>
      <div class="intro-sub">Click anywhere to begin</div>
    </div>
  </div>

  <div id="note-caption">Brahms&rsquo; Lullaby &middot; Tuned Brass &amp; Walnut</div>

  <div id="hud">
    <button id="btn-pause" class="hud-btn" type="button">Pause</button>
    <button id="btn-mute" class="hud-btn" type="button">Mute</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. MUSICAL TUNING & MELODY SCORE (Brahms' Lullaby in F Major)
      // =========================================================================
      // 7 tuned resonator bars arranged from low (left) to high (right)
      const BARS_CONFIG = [
        { name: 'G4',  freq: 392.00, len: 2.38, hue: 0x5c8a8a }, // sea-glass teal
        { name: 'A4',  freq: 440.00, len: 2.22, hue: 0xd48c46 }, // warm amber
        { name: 'Bb4', freq: 466.16, len: 2.12, hue: 0x7b9e6b }, // sage glass
        { name: 'C5',  freq: 523.25, len: 1.98, hue: 0x5d7ca6 }, // cobalt mist
        { name: 'D5',  freq: 587.33, len: 1.85, hue: 0xc26d5c }, // rose copper
        { name: 'E5',  freq: 659.25, len: 1.73, hue: 0xd9b25f }, // champagne gold
        { name: 'F5',  freq: 698.46, len: 1.65, hue: 0x9b7bb0 }  // smoky amethyst
      ];

      // Gentle 3/4 waltz-lullaby timing (in seconds from phrase start)
      // Bar index corresponds to BARS_CONFIG[0..6]
      const MELODY_NOTES = [
        // Measure 1-2: A4 - A4 - C5
        { bar: 1, t: 0.60, vel: 0.78 },
        { bar: 1, t: 1.02, vel: 0.74 },
        { bar: 3, t: 1.44, vel: 0.92 },
        // Measure 3-4: A4 - A4 - C5
        { bar: 1, t: 2.55, vel: 0.76 },
        { bar: 1, t: 2.97, vel: 0.72 },
        { bar: 3, t: 3.39, vel: 0.90 },
        // Measure 5-8: A4 - C5 - F5 - E5 - D5 - D5 - C5
        { bar: 1, t: 4.50, vel: 0.78 },
        { bar: 3, t: 4.92, vel: 0.84 },
        { bar: 6, t: 5.42, vel: 0.96 },
        { bar: 5, t: 6.26, vel: 0.85 },
        { bar: 4, t: 6.72, vel: 0.82 },
        { bar: 4, t: 7.22, vel: 0.76 },
        { bar: 3, t: 7.72, vel: 0.88 },
        // Measure 9-10: G4 - A4 - Bb4 - G4
        { bar: 0, t: 8.95, vel: 0.76 },
        { bar: 1, t: 9.37, vel: 0.80 },
        { bar: 2, t: 9.79, vel: 0.88 },
        { bar: 0, t: 10.45, vel: 0.78 },
        // Measure 11-12: G4 - A4 - Bb4
        { bar: 0, t: 11.45, vel: 0.76 },
        { bar: 1, t: 11.87, vel: 0.80 },
        { bar: 2, t: 12.29, vel: 0.90 },
        // Measure 13-16: G4 - Bb4 - E5 - D5 - C5 - E5 - F5
        { bar: 0, t: 13.38, vel: 0.76 },
        { bar: 2, t: 13.80, vel: 0.84 },
        { bar: 5, t: 14.30, vel: 0.94 },
        { bar: 4, t: 14.95, vel: 0.84 },
        { bar: 3, t: 15.42, vel: 0.82 },
        { bar: 5, t: 15.92, vel: 0.88 },
        { bar: 6, t: 16.52, vel: 0.98 }
      ];

      const PHRASE_DURATION = 20.2; // Includes 3.68s peaceful ring & breath before loop

      // =========================================================================
      // 2. WEB AUDIO SYNTHESIZER (Celesta / Bell-Marimba + Warm Room Reverb)
      // =========================================================================
      class AcousticEngine {
        constructor() {
          this.ctx = null;
          this.master = null;
          this.reverb = null;
          this.muted = false;
          this.ready = false;
        }

        init() {
          if (this.ready) {
            if (this.ctx && this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            return;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;

          this.ctx = new AudioCtx();
          const ctx = this.ctx;

          // Master chain: Compressor -> Master Gain -> Destination
          const comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.knee.value = 18;
          comp.ratio.value = 4;
          comp.attack.value = 0.005;
          comp.release.value = 0.25;

          this.master = ctx.createGain();
          this.master.gain.value = 0.72;

          // Procedural stereo room impulse response (quiet wooden studio)
          const irLen = Math.floor(ctx.sampleRate * 1.9);
          const irBuf = ctx.createBuffer(2, irLen, ctx.sampleRate);
          for (let ch = 0; ch < 2; ch++) {
            const data = irBuf.getChannelData(ch);
            let lp = 0;
            for (let i = 0; i < irLen; i++) {
              const t = i / ctx.sampleRate;
              const env = Math.exp(-t * 2.6) * (1 - Math.exp(-t * 45));
              const white = Math.random() * 2 - 1;
              lp = lp * 0.65 + white * 0.35; // warm wooden damping
              data[i] = lp * env * 0.45;
            }
          }
          this.reverb = ctx.createConvolver();
          this.reverb.buffer = irBuf;

          const wetGain = ctx.createGain();
          wetGain.gain.value = 0.26;

          const dryGain = ctx.createGain();
          dryGain.gain.value = 0.88;

          this.bus = ctx.createGain();
          this.bus.connect(dryGain);
          this.bus.connect(this.reverb);
          this.reverb.connect(wetGain);

          dryGain.connect(comp);
          wetGain.connect(comp);
          comp.connect(this.master);
          this.master.connect(ctx.destination);

          this.ready = true;
        }

        setMuted(muted) {
          this.muted = muted;
          if (this.master && this.ctx) {
            this.master.gain.setTargetAtTime(muted ? 0 : 0.72, this.ctx.currentTime, 0.04);
          }
        }

        playBarNote(freq, velocity) {
          if (!this.ready || !this.ctx || this.muted) return;
          const ctx = this.ctx;
          if (ctx.state === 'suspended') ctx.resume();

          const now = ctx.currentTime;
          const vel = Math.max(0.25, Math.min(1.0, velocity || 0.8));

          // Decay scales naturally with pitch (lower bars ring longer)
          const decay = 2.4 * Math.pow(440 / freq, 0.45);

          // 1. Warm Fundamental (bell-marimba core)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);
          gain1.gain.setValueAtTime(0.0001, now);
          gain1.gain.linearRampToValueAtTime(0.32 * vel, now + 0.004);
          gain1.gain.exponentialRampToValueAtTime(0.0001, now + decay);
          osc1.connect(gain1);
          gain1.connect(this.bus);
          osc1.start(now);
          osc1.stop(now + decay + 0.05);

          // 2. Octave / Marimba 2nd mode (adds wooden/brass body)
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 2.0, now);
          gain2.gain.setValueAtTime(0.0001, now);
          gain2.gain.linearRampToValueAtTime(0.11 * vel, now + 0.003);
          gain2.gain.exponentialRampToValueAtTime(0.0001, now + decay * 0.34);
          osc2.connect(gain2);
          gain2.connect(this.bus);
          osc2.start(now);
          osc2.stop(now + decay * 0.4);

          // 3. Inharmonic metallic shimmer (3.98x partial, very brief)
          const osc3 = ctx.createOscillator();
          const gain3 = ctx.createGain();
          osc3.type = 'sine';
          osc3.frequency.setValueAtTime(freq * 3.98, now);
          gain3.gain.setValueAtTime(0.0001, now);
          gain3.gain.linearRampToValueAtTime(0.045 * vel, now + 0.002);
          gain3.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
          osc3.connect(gain3);
          gain3.connect(this.bus);
          osc3.start(now);
          osc3.stop(now + 0.26);

          // 4. Glass-on-brass impact transient ("tink")
          const clickLen = Math.floor(ctx.sampleRate * 0.018);
          const clickBuf = ctx.createBuffer(1, clickLen, ctx.sampleRate);
          const cData = clickBuf.getChannelData(0);
          for (let i = 0; i < clickLen; i++) {
            cData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (clickLen * 0.22));
          }
          const clickSrc = ctx.createBufferSource();
          clickSrc.buffer = clickBuf;
          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.value = Math.min(4800, freq * 5.2);
          bp.Q.value = 3.5;
          const clickGain = ctx.createGain();
          clickGain.gain.value = 0.08 * vel;
          clickSrc.connect(bp);
          bp.connect(clickGain);
          clickGain.connect(this.bus);
          clickSrc.start(now);
        }

        playMarbleSettle(intensity) {
          if (!this.ready || !this.ctx || this.muted) return;
          const ctx = this.ctx;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          const f = 1400 + Math.random() * 700;
          osc.frequency.setValueAtTime(f, now);
          osc.frequency.exponentialRampToValueAtTime(f * 0.7, now + 0.035);
          const amp = Math.min(0.035, intensity * 0.025);
          g.gain.setValueAtTime(amp, now);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
          osc.connect(g);
          g.connect(this.bus);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      }

      const audio = new AcousticEngine();

      // =========================================================================
      // 3. PROCEDURAL TEXTURES (Walnut Wood & Brushed Brass)
      // =========================================================================
      function createWoodTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // Rich dark walnut base
        ctx.fillStyle = '#3b2416';
        ctx.fillRect(0, 0, 512, 512);

        // Organic wood grain streaks
        for (let y = 0; y < 512; y++) {
          const wave = Math.sin(y * 0.045) * 14 + Math.sin(y * 0.13) * 5;
          const tone = Math.sin((y + wave) * 0.18);
          const r = Math.floor(54 + tone * 14);
          const g = Math.floor(33 + tone * 9);
          const b = Math.floor(20 + tone * 5);
          ctx.fillStyle = `rgba(${r},${g},${b},0.45)`;
          ctx.fillRect(0, y, 512, 1.5);
        }

        // Subtle fine pores
        ctx.fillStyle = 'rgba(20, 10, 5, 0.16)';
        for (let i = 0; i < 1400; i++) {
          const x = Math.random() * 512;
          const y = Math.random() * 512;
          const w = 8 + Math.random() * 28;
          ctx.fillRect(x, y, w, 1);
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 2);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function createBrushedBrassTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#d4a853';
        ctx.fillRect(0, 0, 256, 256);

        for (let y = 0; y < 256; y++) {
          const v = 195 + Math.floor((Math.random() - 0.5) * 24);
          ctx.fillStyle = `rgba(${v}, ${Math.floor(v * 0.78)}, ${Math.floor(v * 0.38)}, 0.35)`;
          ctx.fillRect(0, y, 256, 1);
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // =========================================================================
      // 4. THREE.JS SCENE, ENVIRONMENT MAP & LIGHTING
      // =========================================================================
      const container = document.getElementById('canvas-container');
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x110e0b);
      scene.fog = new THREE.FogExp2(0x110e0b, 0.032);

      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 80);

      // Procedural Studio Environment Map for crisp glass & brass reflections
      function buildEnvMap() {
        const pmrem = new THREE.PMREMGenerator(renderer);
        const envScene = new THREE.Scene();
        envScene.background = new THREE.Color(0x14100c);

        // Warm softbox overhead
        const topPanel = new THREE.Mesh(
          new THREE.PlaneGeometry(14, 14),
          new THREE.MeshBasicMaterial({ color: 0xffe4b8, side: THREE.DoubleSide })
        );
        topPanel.position.set(-4, 9, 4);
        topPanel.lookAt(0, 0, 0);
        envScene.add(topPanel);

        // Cool window reflection on the right
        const sidePanel = new THREE.Mesh(
          new THREE.PlaneGeometry(10, 12),
          new THREE.MeshBasicMaterial({ color: 0x9ec0e6, side: THREE.DoubleSide })
        );
        sidePanel.position.set(10, 4, -5);
        sidePanel.lookAt(0, 0, 0);
        envScene.add(sidePanel);

        // Warm amber accent low-left
        const warmAccent = new THREE.Mesh(
          new THREE.PlaneGeometry(8, 6),
          new THREE.MeshBasicMaterial({ color: 0xe6a145, side: THREE.DoubleSide })
        );
        warmAccent.position.set(-9, 2, -6);
        warmAccent.lookAt(0, 0, 0);
        envScene.add(warmAccent);

        const rt = pmrem.fromScene(envScene, 0.04);
        pmrem.dispose();
        return rt.texture;
      }

      const envMap = buildEnvMap();
      scene.environment = envMap;

      // Lighting: warm key spot, cool rim, soft hemisphere fill
      const hemiLight = new THREE.HemisphereLight(0xffe8c8, 0x261a10, 0.45);
      scene.add(hemiLight);

      const keyLight = new THREE.SpotLight(0xffe1b0, 2.35, 36, Math.PI / 4.2, 0.55, 1.3);
      keyLight.position.set(-6.5, 11.5, 6.5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.bias = -0.0004;
      keyLight.shadow.camera.near = 2;
      keyLight.shadow.camera.far = 26;
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x8bb2db, 0.72);
      rimLight.position.set(7, 6, -6);
      scene.add(rimLight);

      const warmFill = new THREE.PointLight(0xffb86b, 0.55, 14);
      warmFill.position.set(0, 2.5, 4.5);
      scene.add(warmFill);

      // =========================================================================
      // 5. MATERIALS
      // =========================================================================
      const woodTex = createWoodTexture();
      const brassTex = createBrushedBrassTexture();

      const walnutMat = new THREE.MeshStandardMaterial({
        map: woodTex,
        roughness: 0.42,
        metalness: 0.04,
        envMapIntensity: 0.55
      });

      const darkWalnutMat = new THREE.MeshStandardMaterial({
        map: woodTex,
        color: 0x7a5942,
        roughness: 0.48,
        metalness: 0.04,
        envMapIntensity: 0.45
      });

      const brassMat = new THREE.MeshStandardMaterial({
        map: brassTex,
        color: 0xd9ad57,
        metalness: 0.88,
        roughness: 0.23,
        envMapIntensity: 1.35
      });

      const agedBrassMat = new THREE.MeshStandardMaterial({
        map: brassTex,
        color: 0xa67f38,
        metalness: 0.85,
        roughness: 0.34,
        envMapIntensity: 1.1
      });

      const feltMat = new THREE.MeshStandardMaterial({
        color: 0x241914,
        roughness: 0.95,
        metalness: 0.0
      });

      // =========================================================================
      // 6. SCULPTURAL MACHINE ARCHITECTURE
      // =========================================================================
      const machineGroup = new THREE.Group();
      scene.add(machineGroup);

      // Tabletop
      const tableMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(14, 14, 0.6, 64),
        walnutMat
      );
      tableMesh.position.y = -0.3;
      tableMesh.receiveShadow = true;
      machineGroup.add(tableMesh);

      // Beveled Walnut Plinth Base
      const plinth = new THREE.Mesh(
        new THREE.BoxGeometry(8.2, 0.34, 5.4),
        darkWalnutMat
      );
      plinth.position.set(0, 0.17, 0);
      plinth.castShadow = true;
      plinth.receiveShadow = true;
      machineGroup.add(plinth);

      // Brass Corner Trim Plates on Plinth
      const trimGeo = new THREE.BoxGeometry(8.28, 0.07, 5.48);
      const trimMesh = new THREE.Mesh(trimGeo, agedBrassMat);
      trimMesh.position.set(0, 0.04, 0);
      machineGroup.add(trimMesh);

      // Resonator Soundbox (Walnut acoustic chamber beneath the 7 tuned bars)
      const soundbox = new THREE.Mesh(
        new THREE.BoxGeometry(5.6, 0.52, 1.55),
        walnutMat
      );
      soundbox.position.set(0.25, 0.60, 0.55);
      soundbox.castShadow = true;
      soundbox.receiveShadow = true;
      machineGroup.add(soundbox);

      // Acoustic Sound-Holes (brass-rimmed slots on front of soundbox)
      for (let i = -2; i <= 2; i++) {
        const hole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.11, 0.11, 0.05, 24),
          feltMat
        );
        hole.rotation.x = Math.PI / 2;
        hole.position.set(0.25 + i * 0.95, 0.60, 1.32);
        machineGroup.add(hole);

        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.115, 0.016, 12, 24),
          brassMat
        );
        ring.position.set(0.25 + i * 0.95, 0.60, 1.335);
        machineGroup.add(ring);
      }

      // =========================================================================
      // 7. TUNED RESONATOR BARS (7 Bars in a Graceful Stepped Fan)
      // =========================================================================
      const BAR_Z = 0.55;
      const BAR_Y = 0.96;
      const BAR_SPACING = 0.72;
      const BAR_START_X = -1.91; // centered around x = 0.25

      const bars = [];
      const barRipples = [];

      BARS_CONFIG.forEach((cfg, idx) => {
        const x = BAR_START_X + idx * BAR_SPACING;
        const barWidth = 0.36;
        const barThick = 0.075;
        const barLen = cfg.len;

        // Nodal felt pads (2 per bar)
        const padOffset = barLen * 0.27;
        [-padOffset, padOffset].forEach((pz) => {
          const pad = new THREE.Mesh(
            new THREE.BoxGeometry(barWidth * 0.85, 0.06, 0.12),
            feltMat
          );
          pad.position.set(x, BAR_Y - 0.065, BAR_Z + pz);
          machineGroup.add(pad);

          const pin = new THREE.Mesh(
            new THREE.CylinderGeometry(0.014, 0.014, 0.14, 12),
            brassMat
          );
          pin.position.set(x, BAR_Y - 0.02, BAR_Z + pz);
          machineGroup.add(pin);
        });

        // Tuned metal bar
        const mat = new THREE.MeshPhysicalMaterial({
          map: brassTex,
          color: 0xebd9b7,
          metalness: 0.86,
          roughness: 0.18,
          clearcoat: 0.45,
          clearcoatRoughness: 0.14,
          envMapIntensity: 1.4,
          emissive: new THREE.Color(0xffa43b),
          emissiveIntensity: 0.0
        });

        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(barWidth, barThick, barLen),
          mat
        );
        // Slightly tilted toward front so marble bounces forward-down into collector
        const tiltX = 0.16;
        mesh.position.set(x, BAR_Y, BAR_Z);
        mesh.rotation.x = tiltX;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        machineGroup.add(mesh);

        // Impact shimmer ring (hidden until struck)
        const rippleGeo = new THREE.RingGeometry(0.06, 0.10, 32);
        const rippleMat = new THREE.MeshBasicMaterial({
          color: 0xffd27d,
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide
        });
        const ripple = new THREE.Mesh(rippleGeo, rippleMat);
        ripple.rotation.x = -Math.PI / 2 + tiltX;
        ripple.position.set(x, BAR_Y + 0.05, BAR_Z - 0.12);
        machineGroup.add(ripple);
        barRipples.push({ mesh: ripple, age: 99 });

        bars.push({
          idx,
          cfg,
          mesh,
          mat,
          baseY: BAR_Y,
          baseTiltX: tiltX,
          strikePoint: new THREE.Vector3(x, BAR_Y + 0.04, BAR_Z - 0.10),
          vibTime: 99,
          vibAmp: 0,
          glow: 0
        });
      });

      // =========================================================================
      // 8. UPPER BRASS RESERVOIR, ESCAPEMENT & 7 TWIN-RAIL CURVED TRACKS
      // =========================================================================
      const MARBLE_RADIUS = 0.115;
      const RAIL_GAUGE = 0.092; // half-spacing between twin brass rails
      const RAIL_RADIUS = 0.016;
      const GRAVITY = 9.8;

      // Upper Walnut & Brass Bridge Arch at back
      const bridgeTopY = 3.55;
      const bridgeZ = -1.65;

      // Two graceful walnut pillars supporting the upper distributor bar
      [-2.85, 3.15].forEach((px) => {
        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.11, 0.14, bridgeTopY - 0.3, 20),
          walnutMat
        );
        pillar.position.set(px, (bridgeTopY + 0.3) * 0.5, bridgeZ);
        pillar.castShadow = true;
        pillar.receiveShadow = true;
        machineGroup.add(pillar);

        const collar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.155, 0.155, 0.10, 20),
          brassMat
        );
        collar.position.set(px, 0.38, bridgeZ);
        machineGroup.add(collar);

        const cap = new THREE.Mesh(
          new THREE.SphereGeometry(0.145, 20, 16),
          brassMat
        );
        cap.position.set(px, bridgeTopY + 0.02, bridgeZ);
        machineGroup.add(cap);
      });

      // Horizontal walnut crossbeam at top
      const beam = new THREE.Mesh(
        new THREE.BoxGeometry(6.2, 0.16, 0.32),
        walnutMat
      );
      beam.position.set(0.15, bridgeTopY, bridgeZ);
      beam.castShadow = true;
      machineGroup.add(beam);

      // Build 7 Twin-Rail Curved Brass Tracks + Release Gates
      const tracks = [];

      function buildTrack(barIdx) {
        const bar = bars[barIdx];
        const targetX = bar.strikePoint.x;
        const targetY = bar.strikePoint.y;
        const targetZ = bar.strikePoint.z;

        // Launch lip sits slightly above and behind the bar's strike point
        const lipX = targetX;
        const lipY = targetY + 0.42;
        const lipZ = targetZ - 0.52;

        // Start point along the upper distributor beam, with subtle S-curve offset
        const startX = targetX * 0.84 + Math.sin(barIdx * 1.1) * 0.18;
        const startY = bridgeTopY + 0.14;
        const startZ = bridgeZ + 0.12;

        // Control points for a smooth, sculptural, gravity-fed descent
        const mid1 = new THREE.Vector3(
          startX + Math.sin(barIdx * 0.9 - 1.2) * 0.24,
          startY - 0.55,
          THREE.MathUtils.lerp(startZ, lipZ, 0.32)
        );
        const mid2 = new THREE.Vector3(
          THREE.MathUtils.lerp(startX, lipX, 0.72) - Math.sin(barIdx * 0.9 - 1.2) * 0.14,
          lipY + 0.78,
          THREE.MathUtils.lerp(startZ, lipZ, 0.68)
        );

        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(startX, startY, startZ),
          mid1,
          mid2,
          new THREE.Vector3(lipX, lipY, lipZ)
        ]);

        // Sample arc-length table for smooth physics along the curve
        const totalLen = curve.getLength();

        // Build twin parallel brass rails using Frenet-like horizontal normal
        const segments = 64;
        const leftPts = [];
        const rightPts = [];
        const up = new THREE.Vector3(0, 1, 0);

        for (let i = 0; i <= segments; i++) {
          const u = i / segments;
          const p = curve.getPointAt(u);
          const tan = curve.getTangentAt(u).normalize();
          const side = new THREE.Vector3().crossVectors(tan, up).normalize();
          // Offset rails slightly below marble center
          const railDrop = -MARBLE_RADIUS * 0.58;
          leftPts.push(p.clone().addScaledVector(side, -RAIL_GAUGE).add(new THREE.Vector3(0, railDrop, 0)));
          rightPts.push(p.clone().addScaledVector(side, RAIL_GAUGE).add(new THREE.Vector3(0, railDrop, 0)));
        }

        const leftCurve = new THREE.CatmullRomCurve3(leftPts);
        const rightCurve = new THREE.CatmullRomCurve3(rightPts);

        const leftRail = new THREE.Mesh(new THREE.TubeGeometry(leftCurve, 56, RAIL_RADIUS, 10, false), brassMat);
        const rightRail = new THREE.Mesh(new THREE.TubeGeometry(rightCurve, 56, RAIL_RADIUS, 10, false), brassMat);
        leftRail.castShadow = true;
        rightRail.castShadow = true;
        machineGroup.add(leftRail, rightRail);

        // Delicate brass cross-ties & vertical stanchions
        [0.18, 0.52, 0.86].forEach((u) => {
          const p = curve.getPointAt(u);
          const tan = curve.getTangentAt(u).normalize();
          const side = new THREE.Vector3().crossVectors(tan, up).normalize();
          const railY = p.y - MARBLE_RADIUS * 0.66;

          const tie = new THREE.Mesh(
            new THREE.CylinderGeometry(0.012, 0.012, RAIL_GAUGE * 2.2, 8),
            agedBrassMat
          );
          tie.position.set(p.x, railY, p.z);
          tie.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), side);
          machineGroup.add(tie);

          if (u > 0.3) {
            const postH = railY - 0.34;
            if (postH > 0.1) {
              const post = new THREE.Mesh(
                new THREE.CylinderGeometry(0.018, 0.024, postH, 10),
                agedBrassMat
              );
              post.position.set(p.x, 0.34 + postH * 0.5, p.z);
              post.castShadow = true;
              machineGroup.add(post);
            }
          }
        });

        // Brass Release Gate Cradle at top of track
        const gatePivot = new THREE.Group();
        gatePivot.position.set(startX, startY + 0.06, startZ + 0.08);
        const gatePaddle = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, 0.14, 0.025),
          brassMat
        );
        gatePaddle.position.set(0, 0.02, 0);
        gatePivot.add(gatePaddle);
        machineGroup.add(gatePivot);

        // Pre-measure exact physics travel time from release (s = 0) to bar strike
        const travelData = simulateTrackTravelTime(curve, totalLen, targetY);

        return {
          barIdx,
          curve,
          totalLen,
          gatePivot,
          gateOpenTimer: 0,
          travelTime: travelData.travelTime,
          launchSpeed: travelData.launchSpeed,
          startPos: curve.getPointAt(0)
        };
      }

      // Deterministic physics pre-measurement so every marble hits on the exact beat
      function simulateTrackTravelTime(curve, totalLen, barTargetY) {
        const dt = 1 / 120;
        let s = 0;
        let v = 0.25; // gentle initial nudge as gate opens
        let t = 0;

        // Phase 1: Roll along twin-rail curve
        while (s < totalLen && t < 5.0) {
          const u = Math.min(1, s / totalLen);
          const tan = curve.getTangentAt(u).normalize();
          const sinSlope = -tan.y; // downward component
          const accel = GRAVITY * sinSlope * 0.714 - v * 0.09; // rolling sphere factor (5/7 g sin theta)
          v = Math.max(0.05, v + accel * dt);
          s += v * dt;
          t += dt;
        }

        // Phase 2: Parabolic free-fall from launch lip to resonator bar
        const pos = curve.getPointAt(1).clone();
        const tan = curve.getTangentAt(1).normalize();
        const vel = tan.multiplyScalar(v);
        while (pos.y > barTargetY + MARBLE_RADIUS && t < 6.0) {
          vel.y -= GRAVITY * dt;
          pos.addScaledVector(vel, dt);
          t += dt;
        }

        return { travelTime: t, launchSpeed: v };
      }

      for (let i = 0; i < bars.length; i++) {
        tracks.push(buildTrack(i));
      }

      // =========================================================================
      // 9. LOWER COLLECTOR TROUGH & RESTING BRASS BOWL
      // =========================================================================
      // Gentle sloped walnut catch-ramp in front of the bars
      const catchRamp = new THREE.Mesh(
        new THREE.BoxGeometry(5.9, 0.08, 1.35),
        walnutMat
      );
      catchRamp.position.set(0.25, 0.42, 1.72);
      catchRamp.rotation.x = 0.14;
      catchRamp.rotation.z = -0.06; // slopes gently toward the right-front bowl
      catchRamp.receiveShadow = true;
      catchRamp.castShadow = true;
      machineGroup.add(catchRamp);

      // Front brass guard rail along the catch-ramp
      const guardRail = new THREE.Mesh(
        new THREE.CylinderGeometry(0.022, 0.022, 5.9, 12),
        brassMat
      );
      guardRail.rotation.z = Math.PI / 2 - 0.06;
      guardRail.position.set(0.25, 0.48, 2.34);
      machineGroup.add(guardRail);

      // Circular Brass-Rimmed Resting Bowl at front-right
      const BOWL_CENTER = new THREE.Vector3(3.15, 0.36, 1.55);
      const BOWL_RADIUS = 0.72;

      const bowlBase = new THREE.Mesh(
        new THREE.CylinderGeometry(BOWL_RADIUS, BOWL_RADIUS + 0.08, 0.12, 36),
        feltMat
      );
      bowlBase.position.copy(BOWL_CENTER);
      bowlBase.receiveShadow = true;
      machineGroup.add(bowlBase);

      const bowlRim = new THREE.Mesh(
        new THREE.TorusGeometry(BOWL_RADIUS, 0.045, 16, 48),
        brassMat
      );
      bowlRim.rotation.x = Math.PI / 2;
      bowlRim.position.set(BOWL_CENTER.x, BOWL_CENTER.y + 0.07, BOWL_CENTER.z);
      bowlRim.castShadow = true;
      machineGroup.add(bowlRim);

      // =========================================================================
      // 10. SLOWLY TURNING BRASS SCULPTURAL FLYWHEEL (Visual Heartbeat)
      // =========================================================================
      const wheelGroup = new THREE.Group();
      wheelGroup.position.set(-3.15, 1.85, -0.45);
      machineGroup.add(wheelGroup);

      const outerWheel = new THREE.Mesh(
        new THREE.TorusGeometry(0.85, 0.032, 14, 48),
        brassMat
      );
      outerWheel.rotation.y = Math.PI / 2;
      outerWheel.castShadow = true;
      wheelGroup.add(outerWheel);

      for (let s = 0; s < 6; s++) {
        const spoke = new THREE.Mesh(
          new THREE.CylinderGeometry(0.015, 0.015, 1.66, 8),
          agedBrassMat
        );
        spoke.rotation.x = (s / 6) * Math.PI;
        wheelGroup.add(spoke);
      }

      const hub = new THREE.Mesh(
        new THREE.CylinderGeometry(0.11, 0.11, 0.18, 20),
        brassMat
      );
      hub.rotation.z = Math.PI / 2;
      wheelGroup.add(hub);

      const wheelStand = new THREE.Mesh(
        new THREE.CylinderGeometry(0.055, 0.085, 1.55, 16),
        walnutMat
      );
      wheelStand.position.set(-3.15, 1.08, -0.45);
      wheelStand.castShadow = true;
      machineGroup.add(wheelStand);

      // =========================================================================
      // 11. SUNLIT DUST MOTES (Quiet Room Atmosphere)
      // =========================================================================
      const moteCount = 90;
      const motePos = new Float32Array(moteCount * 3);
      for (let i = 0; i < moteCount; i++) {
        motePos[i * 3] = (Math.random() - 0.5) * 11;
        motePos[i * 3 + 1] = 0.5 + Math.random() * 5.2;
        motePos[i * 3 + 2] = (Math.random() - 0.5) * 9;
      }
      const moteGeo = new THREE.BufferGeometry();
      moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
      const moteMat = new THREE.PointsMaterial({
        color: 0xffe4b5,
        size: 0.032,
        transparent: true,
        opacity: 0.38,
        depthWrite: false
      });
      const motes = new THREE.Points(moteGeo, moteMat);
      scene.add(motes);

      // =========================================================================
      // 12. GLASS MARBLES & REAL-TIME PHYSICS SIMULATION
      // =========================================================================
      const marbleGeo = new THREE.SphereGeometry(MARBLE_RADIUS, 28, 28);
      const marbleMaterials = BARS_CONFIG.map((cfg) => {
        return new THREE.MeshPhysicalMaterial({
          color: cfg.hue,
          metalness: 0.02,
          roughness: 0.04,
          transmission: 0.78,
          transparent: true,
          opacity: 0.94,
          ior: 1.52,
          reflectivity: 1.0,
          clearcoat: 1.0,
          clearcoatRoughness: 0.03,
          envMapIntensity: 2.1
        });
      });

      const activeMarbles = [];
      const MAX_MARBLES = 34;

      function spawnMarble(noteEvent) {
        const track = tracks[noteEvent.bar];
        const mat = marbleMaterials[noteEvent.bar];
        const mesh = new THREE.Mesh(marbleGeo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.position.copy(track.startPos);
        machineGroup.add(mesh);

        // Open the brass release gate
        track.gateOpenTimer = 0.24;

        activeMarbles.push({
          mesh,
          barIdx: noteEvent.bar,
          velNote: noteEvent.vel,
          state: 'track', // 'track' -> 'air' -> 'trough' -> 'bowl'
          s: 0,
          speed: 0.25,
          pos: track.startPos.clone(),
          vel: new THREE.Vector3(),
          hitBar: false,
          age: 0,
          fadeOut: false
        });

        // Gracefully retire oldest settled marble if bowl gets full
        if (activeMarbles.length > MAX_MARBLES) {
          const oldest = activeMarbles.shift();
          machineGroup.remove(oldest.mesh);
        }
      }

      // =========================================================================
      // 13. PERFORMANCE SCHEDULER & CAMERA DRIFT
      // =========================================================================
      let isStarted = false;
      let isPaused = false;
      let phraseTime = 0;
      let nextNoteCursor = 0;
      let lastPhraseTrigger = -1;

      // Pre-compute release times for every note in the melody
      const scheduledEvents = MELODY_NOTES.map((n, i) => {
        const travel = tracks[n.bar].travelTime;
        return {
          id: i,
          bar: n.bar,
          vel: n.vel,
          strikeTime: n.t,
          releaseTime: n.t - travel
        };
      }).sort((a, b) => a.releaseTime - b.releaseTime);

      // Normalize so the earliest release happens at t = 0.25s after click
      const minRelease = scheduledEvents[0].releaseTime;
      const offsetShift = 0.25 - minRelease;
      scheduledEvents.forEach((ev) => {
        ev.releaseTime += offsetShift;
        ev.strikeTime += offsetShift;
      });

      // Camera orbit state (slow gallery drift + optional mouse/touch drag)
      let camTheta = 0.42;
      let camPhi = 1.08; // elevation angle from Y axis
      let camRadius = 8.4;
      let targetTheta = camTheta;
      let targetPhi = camPhi;
      let isDragging = false;
      let prevPointer = { x: 0, y: 0 };
      let lastInteractTime = 0;

      function updateCamera(dt, elapsed) {
        if (!isDragging && (elapsed - lastInteractTime > 2.2)) {
          // Unhurried gallery orbit
          targetTheta += dt * 0.085;
          targetPhi = 1.06 + Math.sin(elapsed * 0.14) * 0.05;
        }
        camTheta += (targetTheta - camTheta) * Math.min(1, dt * 4.5);
        camPhi += (targetPhi - camPhi) * Math.min(1, dt * 4.5);

        const lookTarget = new THREE.Vector3(0.15, 1.35, 0.15);
        camera.position.set(
          lookTarget.x + camRadius * Math.sin(camPhi) * Math.sin(camTheta),
          lookTarget.y + camRadius * Math.cos(camPhi),
          lookTarget.z + camRadius * Math.sin(camPhi) * Math.cos(camTheta)
        );
        camera.lookAt(lookTarget);
      }

      // Pointer drag handlers
      container.addEventListener('pointerdown', (e) => {
        isDragging = true;
        prevPointer.x = e.clientX;
        prevPointer.y = e.clientY;
        lastInteractTime = performance.now() * 0.001;
      });
      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevPointer.x;
        const dy = e.clientY - prevPointer.y;
        prevPointer.x = e.clientX;
        prevPointer.y = e.clientY;
        targetTheta -= dx * 0.0055;
        targetPhi = THREE.MathUtils.clamp(targetPhi - dy * 0.0045, 0.55, 1.38);
        lastInteractTime = performance.now() * 0.001;
      });
      window.addEventListener('pointerup', () => {
        isDragging = false;
      });

      // =========================================================================
      // 14. MAIN PHYSICS & RENDER LOOP
      // =========================================================================
      const FIXED_DT = 1 / 120;
      let accumulator = 0;
      let lastFrameTime = performance.now() * 0.001;

      function stepPhysics(dt) {
        // Advance melody scheduler
        if (isStarted && !isPaused) {
          phraseTime += dt;
          while (
            nextNoteCursor < scheduledEvents.length &&
            phraseTime >= scheduledEvents[nextNoteCursor].releaseTime
          ) {
            spawnMarble(scheduledEvents[nextNoteCursor]);
            nextNoteCursor++;
          }
          if (phraseTime >= PHRASE_DURATION + offsetShift) {
            phraseTime = 0;
            nextNoteCursor = 0;
          }

          // Turn flywheel gently
          wheelGroup.rotation.x += dt * 0.42;
        }

        // Update release gates
        for (let i = 0; i < tracks.length; i++) {
          const tr = tracks[i];
          if (tr.gateOpenTimer > 0) {
            tr.gateOpenTimer -= dt;
            tr.gatePivot.rotation.x = THREE.MathUtils.lerp(tr.gatePivot.rotation.x, -0.75, 0.25);
          } else {
            tr.gatePivot.rotation.x = THREE.MathUtils.lerp(tr.gatePivot.rotation.x, 0, 0.15);
          }
        }

        // Update bar vibrations & shimmer
        for (let i = 0; i < bars.length; i++) {
          const b = bars[i];
          if (b.vibTime < 1.8) {
            b.vibTime += dt;
            const decay = Math.exp(-b.vibTime * 5.2);
            const osc = Math.sin(b.vibTime * 58) * b.vibAmp * decay;
            b.mesh.position.y = b.baseY + osc;
            b.mesh.rotation.x = b.baseTiltX + osc * 0.35;
            b.mat.emissiveIntensity = b.glow * Math.exp(-b.vibTime * 3.4);
          } else {
            b.mesh.position.y = b.baseY;
            b.mesh.rotation.x = b.baseTiltX;
            b.mat.emissiveIntensity = 0;
          }

          const rip = barRipples[i];
          if (rip.age < 0.75) {
            rip.age += dt;
            const p = rip.age / 0.75;
            const scale = 1 + p * 3.2;
            rip.mesh.scale.set(scale, scale, 1);
            rip.mesh.material.opacity = (1 - p) * 0.65;
          } else {
            rip.mesh.material.opacity = 0;
          }
        }

        // Step each marble
        for (let i = 0; i < activeMarbles.length; i++) {
          const m = activeMarbles[i];
          m.age += dt;

          if (m.state === 'track') {
            const tr = tracks[m.barIdx];
            const u = Math.min(1, m.s / tr.totalLen);
            const tan = tr.curve.getTangentAt(u).normalize();
            const sinSlope = -tan.y;
            const accel = GRAVITY * sinSlope * 0.714 - m.speed * 0.09;
            m.speed = Math.max(0.05, m.speed + accel * dt);
            m.s += m.speed * dt;

            if (m.s >= tr.totalLen) {
              m.state = 'air';
              m.pos.copy(tr.curve.getPointAt(1));
              m.vel.copy(tan).multiplyScalar(m.speed);
            } else {
              m.pos.copy(tr.curve.getPointAt(m.s / tr.totalLen));
              // Roll rotation around horizontal axis perpendicular to tangent
              const rollAxis = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
              m.mesh.rotateOnWorldAxis(rollAxis, (m.speed * dt) / MARBLE_RADIUS);
            }
          } else if (m.state === 'air') {
            m.vel.y -= GRAVITY * dt;
            m.pos.addScaledVector(m.vel, dt);

            const bar = bars[m.barIdx];
            const barSurfaceY = bar.baseY + 0.04 + MARBLE_RADIUS;

            // Check impact with target tuned bar
            if (!m.hitBar && m.pos.y <= barSurfaceY && m.vel.y < 0) {
              m.hitBar = true;
              m.pos.y = barSurfaceY;

              // Bounce off tilted bar (forward + upward)
              m.vel.y = Math.abs(m.vel.y) * 0.44 + 0.45;
              m.vel.z = Math.max(1.05, m.vel.z * 0.78 + 0.45);
              m.vel.x += (Math.random() - 0.5) * 0.14;

              // Trigger sound + visual bar reaction
              audio.playBarNote(bar.cfg.freq, m.velNote);
              bar.vibTime = 0;
              bar.vibAmp = 0.032 * m.velNote;
              bar.glow = 0.95 * m.velNote;
              barRipples[m.barIdx].age = 0;
            }

            // Land in sloped collector trough
            const troughY = 0.48 + MARBLE_RADIUS - (m.pos.x - 0.25) * 0.06;
            if (m.hitBar && m.pos.z > 1.05 && m.pos.y <= troughY && m.vel.y < 0) {
              m.pos.y = troughY;
              if (Math.abs(m.vel.y) > 0.75) {
                m.vel.y = Math.abs(m.vel.y) * 0.32;
              } else {
                m.state = 'trough';
                m.vel.y = 0;
              }
            }
          } else if (m.state === 'trough') {
            // Roll rightward along the gently tilted walnut catch-ramp into the bowl
            m.vel.x += 1.45 * dt;
            m.vel.z += (1.72 - m.pos.z) * 2.2 * dt;
            m.vel.multiplyScalar(1 - 0.55 * dt);
            m.pos.x += m.vel.x * dt;
            m.pos.z += m.vel.z * dt;
            m.pos.y = 0.48 + MARBLE_RADIUS - (m.pos.x - 0.25) * 0.06;

            // Clamp against front brass guard rail
            if (m.pos.z > 2.22) {
              m.pos.z = 2.22;
              m.vel.z *= -0.35;
            }
            if (m.pos.z < 1.25) {
              m.pos.z = 1.25;
              m.vel.z *= -0.35;
            }

            // Visual roll
            const spd = Math.hypot(m.vel.x, m.vel.z);
            if (spd > 0.02) {
              const axis = new THREE.Vector3(-m.vel.z, 0, m.vel.x).normalize();
              m.mesh.rotateOnWorldAxis(axis, (spd * dt) / MARBLE_RADIUS);
            }

            // Enter resting bowl
            if (m.pos.x > BOWL_CENTER.x - BOWL_RADIUS + 0.14) {
              m.state = 'bowl';
              audio.playMarbleSettle(0.45);
            }
          } else if (m.state === 'bowl') {
            // Gentle bowl gravity toward center + friction
            const dx = BOWL_CENTER.x - m.pos.x;
            const dz = BOWL_CENTER.z - m.pos.z;
            m.vel.x += dx * 1.8 * dt;
            m.vel.z += dz * 1.8 * dt;
            m.vel.multiplyScalar(1 - 3.6 * dt);

            m.pos.x += m.vel.x * dt;
            m.pos.z += m.vel.z * dt;
            m.pos.y = BOWL_CENTER.y + 0.06 + MARBLE_RADIUS;

            // Keep inside brass bowl rim
            const distFromCenter = Math.hypot(m.pos.x - BOWL_CENTER.x, m.pos.z - BOWL_CENTER.z);
            const maxR = BOWL_RADIUS - MARBLE_RADIUS - 0.04;
            if (distFromCenter > maxR) {
              const nx = (m.pos.x - BOWL_CENTER.x) / distFromCenter;
              const nz = (m.pos.z - BOWL_CENTER.z) / distFromCenter;
              m.pos.x = BOWL_CENTER.x + nx * maxR;
              m.pos.z = BOWL_CENTER.z + nz * maxR;
              const vn = m.vel.x * nx + m.vel.z * nz;
              if (vn > 0) {
                m.vel.x -= 1.35 * vn * nx;
                m.vel.z -= 1.35 * vn * nz;
              }
            }

            const spd = Math.hypot(m.vel.x, m.vel.z);
            if (spd > 0.015) {
              const axis = new THREE.Vector3(-m.vel.z, 0, m.vel.x).normalize();
              m.mesh.rotateOnWorldAxis(axis, (spd * dt) / MARBLE_RADIUS);
            }
          }

          m.mesh.position.copy(m.pos);
        }

        // Marble-to-marble soft collisions inside the resting bowl
        for (let i = 0; i < activeMarbles.length; i++) {
          const a = activeMarbles[i];
          if (a.state !== 'bowl') continue;
          for (let j = i + 1; j < activeMarbles.length; j++) {
            const b = activeMarbles[j];
            if (b.state !== 'bowl') continue;
            const dx = b.pos.x - a.pos.x;
            const dz = b.pos.z - a.pos.z;
            const distSq = dx * dx + dz * dz;
            const minDist = MARBLE_RADIUS * 2.02;
            if (distSq < minDist * minDist && distSq > 1e-6) {
              const dist = Math.sqrt(distSq);
              const nx = dx / dist;
              const nz = dz / dist;
              const overlap = (minDist - dist) * 0.5;
              a.pos.x -= nx * overlap;
              a.pos.z -= nz * overlap;
              b.pos.x += nx * overlap;
              b.pos.z += nz * overlap;

              const rvx = b.vel.x - a.vel.x;
              const rvz = b.vel.z - a.vel.z;
              const relNormal = rvx * nx + rvz * nz;
              if (relNormal < 0) {
                const imp = -0.65 * relNormal;
                a.vel.x -= imp * nx;
                a.vel.z -= imp * nz;
                b.vel.x += imp * nx;
                b.vel.z += imp * nz;
              }
            }
          }
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now() * 0.001;
        const frameDt = Math.min(0.05, now - lastFrameTime);
        lastFrameTime = now;

        accumulator += frameDt;
        while (accumulator >= FIXED_DT) {
          stepPhysics(FIXED_DT);
          accumulator -= FIXED_DT;
        }

        // Gentle dust mote drift
        const posAttr = moteGeo.attributes.position;
        for (let i = 0; i < moteCount; i++) {
          let y = posAttr.getY(i) + frameDt * 0.045;
          if (y > 5.7) y = 0.5;
          posAttr.setY(i, y);
        }
        posAttr.needsUpdate = true;

        updateCamera(frameDt, now);
        renderer.render(scene, camera);
      }

      // =========================================================================
      // 15. UI CONTROLS & STARTUP
      // =========================================================================
      const introOverlay = document.getElementById('intro-overlay');
      const hud = document.getElementById('hud');
      const caption = document.getElementById('note-caption');
      const btnPause = document.getElementById('btn-pause');
      const btnMute = document.getElementById('btn-mute');

      function startMachine() {
        if (isStarted) return;
        audio.init();
        isStarted = true;
        introOverlay.classList.add('hidden');
        hud.classList.add('visible');
        caption.classList.add('visible');
      }

      introOverlay.addEventListener('click', startMachine);
      introOverlay.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          startMachine();
        }
      });

      btnPause.addEventListener('click', () => {
        isPaused = !isPaused;
        btnPause.textContent = isPaused ? 'Resume' : 'Pause';
      });

      btnMute.addEventListener('click', () => {
        const nextMuted = !audio.muted;
        audio.setMuted(nextMuted);
        btnMute.textContent = nextMuted ? 'Unmute' : 'Mute';
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Seed 3 resting glass marbles in the lower brass bowl so the opening still-life feels alive
      [0, 2, 5].forEach((barIdx, k) => {
        const mesh = new THREE.Mesh(marbleGeo, marbleMaterials[barIdx]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        const angle = k * 2.1;
        const pos = new THREE.Vector3(
          BOWL_CENTER.x + Math.cos(angle) * 0.24,
          BOWL_CENTER.y + 0.06 + MARBLE_RADIUS,
          BOWL_CENTER.z + Math.sin(angle) * 0.24
        );
        mesh.position.copy(pos);
        machineGroup.add(mesh);
        activeMarbles.push({
          mesh,
          barIdx,
          velNote: 0.7,
          state: 'bowl',
          s: 0,
          speed: 0,
          pos,
          vel: new THREE.Vector3(),
          hitBar: true,
          age: 10
        });
      });

      updateCamera(0.016, 0);
      animate();
    })();
  </script>
</body>
</html>
