<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3;
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const smooth = t => t * t * (3 - 2 * t);
const polar = (r, phi, y) => new V3(r * Math.cos(phi), y, r * Math.sin(phi));

/* =====================================================================
   PHYSICAL CONSTANTS & MACHINE DIMENSIONS
   ===================================================================== */
const G = 9.8, K = 5 / 7, DT = 1 / 360;          // gravity, rolling-sphere factor, sim step
const RM = 0.062;                                 // marble radius
const RAIL_W = 0.040, RAIL_R = 0.0085;            // half rail gap, rail radius
const HC = Math.sqrt((RM + RAIL_R) ** 2 - RAIL_W ** 2); // marble centre above rail line
const MU = 0.011, CD = 0.032;                     // rolling resistance, air/rail drag
const N_ARMS = 11, CAP = 5;
const RING_R = 0.52, LIFT_R = 0.10, R_GATE = 0.95, R_LIP = 1.30;
const Y_EXIT = 3.20, Y_LOAD = 0.04;
const YC = 3.20 - 3.50;
const LEAD = 0.5, STARTS = 3, OMEGA = TAU * 1.1;
const A0 = -Math.PI / 2;
const THETA_G = A0 - 55 * D2R;                    // lift guide angle
const PHI_F = 55 * D2R, PHI_R = 88 * D2R;
const ARM_SP = TAU / N_ARMS;
const armAngle = k => A0 + 15 * D2R + k * ARM_SP;
const R_HOLE = 0.36, R_RIM = 2.30, Y_HOLE = 0.36, Y_RIM = 0.80;
const BOWL_C = (Y_RIM - Y_HOLE) / (1 / R_HOLE - 1 / R_RIM);
const bowlY = r => Y_RIM - BOWL_C * (1 / r - 1 / R_RIM);
const bowlD = r => BOWL_C / (r * r);
const bowlDD = r => -2 * BOWL_C / (r * r * r);
const E_BAR = 0.52, E_BOWL = 0.32;
const BAR_TH = 0.04;

/* =====================================================================
   MUSIC
   ===================================================================== */
const NOTE_NAMES = ['C3', 'F3', 'G3', 'C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];
const MIDI = [48, 53, 55, 60, 62, 64, 65, 67, 69, 71, 72];
const FREQ = MIDI.map(m => 440 * Math.pow(2, (m - 69) / 12));
const IDX = Object.fromEntries(NOTE_NAMES.map((n, i) => [n, i]));
// Brahms, Wiegenlied (Op. 49 No. 4), in C, 3/4 — [note, beats]
const MEL = [
  ['E4', .5], ['E4', .5],
  ['G4', 1.5], ['E4', .5], ['E4', 1],
  ['G4', 2], ['E4', .5], ['G4', .5],
  ['C5', 1], ['B4', 1.5], ['A4', .5],
  ['A4', 1], ['G4', 1], ['D4', .5], ['E4', .5],
  ['F4', 1], ['D4', 1], ['D4', .5], ['E4', .5],
  ['F4', 2], ['D4', .5], ['F4', .5],
  ['B4', .5], ['A4', .5], ['G4', 1], ['B4', 1],
  ['C5', 2], ['C4', .5], ['C4', .5],
  ['C5', 2], ['A4', .5], ['F4', .5],
  ['G4', 2], ['E4', .5], ['C4', .5],
  ['F4', 1], ['G4', 1], ['A4', 1],
  ['G4', 2], ['C4', .5], ['C4', .5],
  ['C5', 2], ['A4', .5], ['F4', .5],
  ['G4', 2], ['E4', .5], ['C4', .5],
  ['F4', 1], ['E4', 1], ['D4', 1],
  ['C4', 3],
];
const CHORDS = ['C', 'C', 'C', 'G', 'G', 'G', 'G', 'C', 'F', 'C', 'F', 'C', 'F', 'C', 'G', 'C'];
const BASS = { C: 'C3', F: 'F3', G: 'G3' };
const TONES = { C: ['C4', 'E4', 'G4'], F: ['C4', 'F4', 'A4'], G: ['D4', 'F4', 'G4', 'B4'] };
const SPB = 60 / 66;

function buildPass(p, t0) {
  const ev = [];
  const total = 49;
  const spb = b => SPB * (1 + 0.32 * sstep(41, 49, b) + 0.06 * sstep(0, -1, b));
  const tab = []; let acc = 0;
  for (let i = 0; i <= (total + 2) * 100; i++) { tab.push(acc); acc += spb(i / 100) / 100; }
  const bt = b => t0 + tab[Math.round(b * 100)];
  const withHarm = p % 2 === 1;
  let b = 0;
  for (const [nm, d] of MEL) {
    const meas = b < 1 ? 0 : Math.floor((b - 1) / 3) + 1;
    const bim = b < 1 ? -1 : (b - 1) % 3;
    const phrase = Math.sin(Math.PI * (((b - 1) % 24 + 24) % 24) / 24);
    let g = 0.70 + 0.12 * phrase + (bim === 0 ? 0.10 : 0) + (d >= 1.5 ? 0.04 : 0) - (d <= 0.5 && bim !== 0 ? 0.05 : 0);
    if (withHarm) g *= 0.94;
    ev.push({ t: bt(b), bar: IDX[nm], gain: g });
    if (withHarm && d >= 1 && meas >= 1) {
      const ch = CHORDS[meas - 1]; const mm = MIDI[IDX[nm]];
      const cand = TONES[ch].filter(n => MIDI[IDX[n]] <= mm - 3);
      if (cand.length) ev.push({ t: bt(b) + 0.012, bar: IDX[cand[cand.length - 1]], gain: 0.40 + 0.06 * phrase });
    }
    b += d;
  }
  for (let m = 1; m <= 16; m++) ev.push({ t: bt(1 + 3 * (m - 1)) - 0.004, bar: IDX[BASS[CHORDS[m - 1]]], gain: m === 16 ? 0.62 : 0.5 });
  // a rolled chord to close
  ev.push({ t: bt(46) + 0.11, bar: IDX['E4'], gain: 0.34 });
  ev.push({ t: bt(46) + 0.23, bar: IDX['G4'], gain: 0.30 });
  if (withHarm) ev.push({ t: bt(46) + 0.36, bar: IDX['C5'], gain: 0.28 });
  ev.sort((a, b2) => a.t - b2.t);
  return { ev, tEnd: bt(total) + SPB * 1.6 };
}

/* =====================================================================
   TRACKS: dense arc-length sampled centre lines for the marble
   ===================================================================== */
class Track {
  constructor(pts) {
    const n = pts.length, cum = new Float64Array(n);
    for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + pts[i].distanceTo(pts[i - 1]);
    const L = cum[n - 1], N = Math.max(2, Math.ceil(L / 0.004) + 1), ds = L / (N - 1);
    this.L = L; this.N = N; this.ds = ds;
    const P = this.P = new Float64Array(N * 3);
    let j = 0;
    for (let i = 0; i < N; i++) {
      const s = i * ds;
      while (j < n - 2 && cum[j + 1] < s) j++;
      const f = clamp((s - cum[j]) / ((cum[j + 1] - cum[j]) || 1), 0, 1);
      const a = pts[j], b = pts[j + 1];
      P[3 * i] = a.x + (b.x - a.x) * f; P[3 * i + 1] = a.y + (b.y - a.y) * f; P[3 * i + 2] = a.z + (b.z - a.z) * f;
    }
    const T = this.T = new Float64Array(N * 3);
    for (let i = 0; i < N; i++) {
      const i0 = Math.max(0, i - 1), i1 = Math.min(N - 1, i + 1);
      let x = P[3 * i1] - P[3 * i0], y = P[3 * i1 + 1] - P[3 * i0 + 1], z = P[3 * i1 + 2] - P[3 * i0 + 2];
      const l = Math.hypot(x, y, z) || 1; T[3 * i] = x / l; T[3 * i + 1] = y / l; T[3 * i + 2] = z / l;
    }
    this.Nn = new Float64Array(N * 3); this.B = new Float64Array(N * 3);
  }
  _ix(s) { let x = s / this.ds; if (x < 0) x = 0; if (x > this.N - 1.000001) x = this.N - 1.000001; const i = x | 0; return [i, x - i]; }
  ty(s) { const [i, f] = this._ix(s); return this.T[3 * i + 1] * (1 - f) + this.T[3 * i + 4] * f; }
  pos(s, out) { const [i, f] = this._ix(s), P = this.P, k = 3 * i; return out.set(P[k] + (P[k + 3] - P[k]) * f, P[k + 1] + (P[k + 4] - P[k + 1]) * f, P[k + 2] + (P[k + 5] - P[k + 2]) * f); }
  vec(arr, s, out) { const [i, f] = this._ix(s), k = 3 * i; return out.set(arr[k] + (arr[k + 3] - arr[k]) * f, arr[k + 1] + (arr[k + 4] - arr[k + 1]) * f, arr[k + 2] + (arr[k + 5] - arr[k + 2]) * f); }
  // speed profile -> banked frames
  frames(v0) {
    const { N, ds, T, P } = this, V = new Float64Array(N);
    let v = v0;
    for (let i = 0; i < N; i++) { V[i] = v; const a = -G * K * T[3 * i + 1] - MU * G - CD * v * v; v = Math.sqrt(Math.max(0.0004, v * v + 2 * a * ds)); }
    this.V = V;
    const U = new Float64Array(N * 3);
    for (let i = 0; i < N; i++) {
      const i0 = Math.max(0, i - 2), i1 = Math.min(N - 1, i + 2), h = (i1 - i0) * ds;
      const kx = (T[3 * i1] - T[3 * i0]) / h, kz = (T[3 * i1 + 2] - T[3 * i0 + 2]) / h;
      const kh = Math.hypot(kx, kz);
      const b = Math.min(1.05, Math.atan2(V[i] * V[i] * kh, G));
      const sx = kh > 1e-6 ? kx / kh : 0, sz = kh > 1e-6 ? kz / kh : 0;
      U[3 * i] = Math.sin(b) * sx; U[3 * i + 1] = Math.cos(b); U[3 * i + 2] = Math.sin(b) * sz;
    }
    const W = 18, Nn = this.Nn, B = this.B;
    for (let i = 0; i < N; i++) {
      let x = 0, y = 0, z = 0;
      for (let j = Math.max(0, i - W); j <= Math.min(N - 1, i + W); j++) { x += U[3 * j]; y += U[3 * j + 1]; z += U[3 * j + 2]; }
      const tx = T[3 * i], ty = T[3 * i + 1], tz = T[3 * i + 2];
      const d = x * tx + y * ty + z * tz; x -= d * tx; y -= d * ty; z -= d * tz;
      const l = Math.hypot(x, y, z); x /= l; y /= l; z /= l;
      Nn[3 * i] = x; Nn[3 * i + 1] = y; Nn[3 * i + 2] = z;
      B[3 * i] = ty * z - tz * y; B[3 * i + 1] = tz * x - tx * z; B[3 * i + 2] = tx * y - ty * x;
    }
    return this;
  }
}

// --- generate the machine's centre lines -------------------------------
const CHUTE_SLOPE = 6 * D2R, RING_SLOPE = 3.0 * D2R;
function polyY(plan, y0, slopeFn) {
  // plan: array of {x,z}; integrates y along horizontal distance with slope angle slopeFn(w)
  let tot = 0; const cum = [0];
  for (let i = 1; i < plan.length; i++) { tot += Math.hypot(plan[i].x - plan[i - 1].x, plan[i].z - plan[i - 1].z); cum.push(tot); }
  const out = []; let y = y0;
  for (let i = 0; i < plan.length; i++) {
    if (i > 0) { const w = (cum[i] + cum[i - 1]) * 0.5 / tot; y -= Math.tan(slopeFn(w, tot)) * (cum[i] - cum[i - 1]); }
    out.push(new V3(plan[i].x, y, plan[i].z));
  }
  return out;
}
const chutePts = (() => {
  const plan = []; for (let i = 0; i <= 90; i++) { const u = i / 90; const phi = THETA_G + (A0 - THETA_G) * u * u; const r = LIFT_R + (RING_R - LIFT_R) * (1 - (1 - u) ** 2); plan.push(polar(r, phi, 0)); }
  return polyY(plan, Y_EXIT, () => CHUTE_SLOPE);
})();
const Y_RING0 = chutePts[chutePts.length - 1].y;
const ringY = phi => Y_RING0 - Math.tan(RING_SLOPE) * RING_R * (phi - A0);
const GATE_Y = ringY(armAngle(N_ARMS - 1)) - 0.15;
function ringPts(phi1) { const pts = []; const n = Math.max(2, Math.ceil((phi1 - A0) / (1.5 * D2R))); for (let i = 1; i <= n; i++) { const phi = A0 + (phi1 - A0) * i / n; pts.push(polar(RING_R, phi, ringY(phi))); } return pts; }
function feederPts(k) {
  const b = armAngle(k), plan = [];
  for (let i = 0; i <= 120; i++) { const u = i / 120; plan.push(polar(RING_R + (R_GATE - RING_R) * smooth(u), b + PHI_F * u, 0)); }
  let Lp = 0; for (let i = 1; i < plan.length; i++) Lp += Math.hypot(plan[i].x - plan[i - 1].x, plan[i].z - plan[i - 1].z);
  const D = ringY(b) - GATE_Y, sE = Math.tan(20 * D2R) * Lp;
  const c1 = 2 * D - sE, c2 = sE - D;
  return polyY(plan, ringY(b), w => Math.atan((c1 + 2 * c2 * w) / Lp));
}
const TH_MAX = 47 * D2R, TH_UP = 11 * D2R;
function rampPts(k) {
  const b = armAngle(k) + PHI_F, plan = [];
  for (let i = 0; i <= 400; i++) { const u = i / 400; plan.push(polar(R_GATE + (R_LIP - R_GATE) * smooth(u), b + PHI_R * u, 0)); }
  return polyY(plan, GATE_Y, w => 20 * D2R + (TH_MAX - 20 * D2R) * sstep(0, 0.17, w) - (TH_MAX + TH_UP) * sstep(0.40, 1.0, w));
}
const deliver = [], ramps = [], junctionS = [];
for (let k = 0; k < N_ARMS; k++) {
  const ring = ringPts(armAngle(k));
  const pre = [...chutePts, ...ring];
  let jl = 0; for (let i = 1; i < pre.length; i++) jl += pre[i].distanceTo(pre[i - 1]);
  junctionS.push(jl);
  const fp = feederPts(k); fp.shift();
  deliver.push(new Track([...pre, ...fp]).frames(0.45));
  ramps.push(new Track(rampPts(k)).frames(0.0));
}

/* =====================================================================
   SIMULATION STATE
   ===================================================================== */
const bars = [];          // tuned bars (filled after placement)
const posts = [];         // bowl obstacles {x,z,r}
const queues = Array.from({ length: N_ARMS }, () => []);
const marbles = [];
const buffer = [];
const liftList = [];
const sim = { n: 0, t: 0, running: false, liftA: 0, slot: 0, liftW: 0 };
const stats = { starved: 0, strikes: 0, maxErr: 0, released: 0, late: [] };
const fx = [];            // incidental sound events produced by sim
let strikeHook = null;
const _v = new V3(), _v2 = new V3();

function stepTrack(m, t) {
  const tr = m.track;
  let a = -G * K * tr.ty(m.s) - CD * m.v * Math.abs(m.v);
  const fr = MU * G;
  if (Math.abs(m.v) > 1e-4) a -= fr * Math.sign(m.v);
  else if (Math.abs(a) <= fr) a = 0; else a -= fr * Math.sign(a);
  m.v += a * DT; m.s += m.v * DT;
  if (m.kind === 0) { // delivery with queue stop
    const stop = tr.L - 2 * RM * m.qi;
    if (m.s >= stop) {
      m.s = stop;
      if (m.v > 0.12) fx.push({ type: 'clack', v: m.v, track: tr, s: stop });
      m.v = -m.v * 0.28; if (Math.abs(m.v) < 0.03) m.v = 0;
    }
  } else if (m.s >= tr.L) {
    tr.pos(tr.L, m.pos); tr.vec(tr.T, tr.L, m.vel).multiplyScalar(m.v);
    m.mode = 'air';
    m.spinAxis.copy(tr.vec(tr.Nn, tr.L, _v)).cross(tr.vec(tr.T, tr.L, _v2)).normalize();
    m.spinRate = m.v / RM;
    return;
  }
  if (m.s < 0) { m.s = 0; if (m.v < 0) m.v = 0; }
}

function stepAir(m, t) {
  const px = m.pos.x, py = m.pos.y, pz = m.pos.z;
  m.vel.y -= G * DT;
  m.pos.x += m.vel.x * DT; m.pos.y += m.vel.y * DT; m.pos.z += m.vel.z * DT;
  if (m.bar >= 0 && !m.struck) {
    const b = bars[m.bar];
    const d0 = b.n.x * (px - b.c.x) + b.n.y * (py - b.c.y) + b.n.z * (pz - b.c.z);
    const d1 = b.n.x * (m.pos.x - b.c.x) + b.n.y * (m.pos.y - b.c.y) + b.n.z * (m.pos.z - b.c.z);
    if (d1 <= RM && d0 > RM) {
      const f = (d0 - RM) / (d0 - d1);
      const hx = px + (m.pos.x - px) * f, hy = py + (m.pos.y - py) * f, hz = pz + (m.pos.z - pz) * f;
      const la = (hx - b.c.x) * b.a.x + (hy - b.c.y) * b.a.y + (hz - b.c.z) * b.a.z;
      const lw = (hx - b.c.x) * b.w.x + (hy - b.c.y) * b.w.y + (hz - b.c.z) * b.w.z;
      if (Math.abs(la) < b.halfL + RM * 0.3 && Math.abs(lw) < b.halfW + RM * 0.6) {
        const vn = m.vel.dot(b.n);
        m.vel.addScaledVector(b.n, -vn);           // tangential part
        m.vel.multiplyScalar(0.9);
        m.vel.addScaledVector(b.n, -vn * E_BAR);   // reflected normal part
        m.pos.set(hx, hy, hz).addScaledVector(m.vel, (1 - f) * DT);
        m.struck = true;
        const th = t + f * DT;
        stats.strikes++;
        if (m.expect !== undefined) stats.maxErr = Math.max(stats.maxErr, Math.abs(th - m.expect));
        if (strikeHook) strikeHook(m.bar, th, -vn, m.noteGain || 0.7);
        m.lastHit = { t: th, vn: -vn };
        m.spinRate *= 0.7;
      }
    }
  }
  const r = Math.hypot(m.pos.x, m.pos.z);
  if (r > R_HOLE && r < R_RIM - RM * 0.5) {
    const hp = bowlD(r), sy = bowlY(r) + RM * Math.sqrt(1 + hp * hp);
    if (m.pos.y <= sy) {
      let nx = -hp * m.pos.x / r, ny = 1, nz = -hp * m.pos.z / r; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
      const vn = m.vel.x * nx + m.vel.y * ny + m.vel.z * nz;
      m.pos.y = sy;
      if (vn < -0.75) {
        const k = -(1 + E_BOWL) * vn; m.vel.x += k * nx; m.vel.y += k * ny; m.vel.z += k * nz;
        m.vel.multiplyScalar(0.92);
        fx.push({ type: 'tock', v: -vn, x: m.pos.x, y: m.pos.y, z: m.pos.z });
      } else {
        m.vel.x -= vn * nx; m.vel.z -= vn * nz;
        m.mode = 'bowl';
        if (vn < -0.12) fx.push({ type: 'tock', v: -vn, x: m.pos.x, y: m.pos.y, z: m.pos.z });
      }
    }
  } else if (r <= R_HOLE && m.pos.y < Y_HOLE + 0.05) {
    m.mode = 'drop';
  }
  if (m.pos.y < -0.5) toBuffer(m);
}

const BOWL_DRAG = 0.16, BOWL_MU = 0.012;
function stepBowl(m) {
  const x = m.pos.x, z = m.pos.z, r = Math.hypot(x, z), rx = x / r, rz = z / r;
  const hp = bowlD(r), hpp = bowlDD(r);
  const vr = m.vel.x * rx + m.vel.z * rz, v2 = m.vel.x * m.vel.x + m.vel.z * m.vel.z, vt2 = Math.max(0, v2 - vr * vr);
  const num = G * K + hpp * vr * vr + (hp / r) * vt2;
  const ar = -num * hp / (1 + hp * hp);
  const sp = Math.sqrt(v2) || 1e-6;
  const drag = BOWL_DRAG + BOWL_MU * G / Math.max(sp, 0.08);
  m.vel.x += (ar * rx - drag * m.vel.x) * DT;
  m.vel.z += (ar * rz - drag * m.vel.z) * DT;
  m.pos.x += m.vel.x * DT; m.pos.z += m.vel.z * DT;
  let r2 = Math.hypot(m.pos.x, m.pos.z);

const strikeLights = [0, 1, 2].map(() => { const l = new THREE.PointLight(0xffc27a, 0, 1.6, 2); scene.add(l); return { l, t: -10, amp: 0 }; });
let slIdx = 0;

/* =====================================================================
   POST
   ===================================================================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.36, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, fade: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform float fade; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 d=vUv-0.5; d.x*=1.25;
      float v=smoothstep(0.95,0.18,length(d)); c.rgb*=mix(0.42,1.0,v);
      c.rgb+= (h(vUv*1000.0+fract(time)*91.0)-0.5)*0.022;
      c.rgb*=fade; gl_FragColor=c; }`
});
composer.addPass(finish);

/* =====================================================================
   AUDIO
   ===================================================================== */
let actx = null, audioStart = 0, dry, revSend, noiseBuf, rollGain, rumbleGain, master;
function initAudio(ctxOverride) {
  actx = ctxOverride || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  master = actx.createGain(); master.gain.value = 0;
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 2.5; comp.attack.value = 0.004; comp.release.value = 0.3;
  const hs = actx.createBiquadFilter(); hs.type = 'highshelf'; hs.frequency.value = 7000; hs.gain.value = -4;
  comp.connect(hs); hs.connect(master); master.connect(actx.destination);
  dry = actx.createGain(); dry.gain.value = 0.9; dry.connect(comp);
  // generated hall-ish impulse response
  const sr = actx.sampleRate, len = Math.floor(sr * 3.4), ir = actx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch); let lp = 0; const R = mulberry(31 + ch);
    for (let i = 0; i < len; i++) {
      const t = i / sr, env = Math.exp(-t * 2.3) * (t < 0.012 ? t / 0.012 : 1);
      const k = 0.55 + 0.4 * Math.min(1, t / 2.5); lp = lp + (1 - k) * ((R() * 2 - 1) - lp);
      d[i] = lp * env * 0.9;
    }
    for (const [tt, g] of [[0.017, 0.5], [0.029, 0.35], [0.041, 0.3], [0.063, 0.22]]) { const i = Math.floor((tt + ch * 0.004) * sr); d[i] += g; }
  }
  const conv = actx.createConvolver(); conv.buffer = ir;
  revSend = actx.createGain(); revSend.gain.value = 0.34;
  const pre = actx.createDelay(0.1); pre.delayTime.value = 0.018;
  revSend.connect(pre); pre.connect(conv); conv.connect(comp);
  // noise
  noiseBuf = actx.createBuffer(1, sr * 2, sr); { const d = noiseBuf.getChannelData(0); const R = mulberry(77); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  // continuous rolling textures (very quiet)
  const mk = (type, f, q) => { const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const bq = actx.createBiquadFilter(); bq.type = type; bq.frequency.value = f; bq.Q.value = q; const g = actx.createGain(); g.gain.value = 0; s.connect(bq); bq.connect(g); g.connect(dry); g.connect(revSend); s.start(); return g; };

  rumbleGain = mk('lowpass', 260, 0.7);
}
function voice(dest, when, pan) {
  const p = actx.createStereoPanner(); p.pan.value = clamp(pan, -0.85, 0.85); p.connect(dry); p.connect(revSend);
  return p;
}
function playBar(k, when, gain, pan) {
  if (!actx) return;
  const f = FREQ[k], bass = f < 200;
  const out = actx.createGain(); out.gain.value = gain * (bass ? 0.30 : 0.21) * Math.pow(262 / f, 0.12);
  out.connect(voice(null, when, pan));
  const T = bass ? 6.0 : clamp(3.8 * Math.pow(262 / f, 0.5), 1.8, 5);
  const parts = bass
    ? [[1, 1, T], [1.0011, 0.32, T * 0.95], [2.0, 0.07, T * 0.4], [3.98, 0.12, T * 0.25], [9.9, 0.025, T * 0.07]]
    : [[1, 1, T], [1.0016, 0.28, T * 0.9], [3.98, 0.24, T * 0.27], [9.92, 0.06, T * 0.08], [2.756, 0.025, T * 0.12]];
  for (const [ratio, amp, t60] of parts) {
    const fr = f * ratio; if (fr > 15000) continue;
    const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = fr;
    const g = actx.createGain();
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(amp, when + 0.0025);
    g.gain.setTargetAtTime(0, when + 0.0025, t60 / 6.9);
    o.connect(g); g.connect(out); o.start(when); o.stop(when + t60 + 0.2);
  }

  const n = actx.createBufferSource(); n.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 5200 + Math.random() * 900; bp.Q.value = 1.4;
  const ng = actx.createGain(); ng.gain.setValueAtTime(0, when); ng.gain.linearRampToValueAtTime(0.16, when + 0.0008); ng.gain.setTargetAtTime(0, when + 0.0008, 0.006);
  n.connect(bp); bp.connect(ng); ng.connect(out); n.start(when, Math.random() * 1.5); n.stop(when + 0.08);
}
function blip(when, f, dec, gain, pan, noiseF) {
  if (!actx) return;
  const out = actx.createGain(); out.gain.value = gain; out.connect(voice(null, when, pan));
  const o = actx.createOscillator(); o.frequency.value = f; const g = actx.createGain();
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + 0.001); g.gain.setTargetAtTime(0, when + 0.001, dec);
  o.connect(g); g.connect(out); o.start(when); o.stop(when + dec * 8);
  if (noiseF) {
    const n = actx.createBufferSource(); n.buffer = noiseBuf; const bq = actx.createBiquadFilter(); bq.type = 'bandpass'; bq.frequency.value = noiseF; bq.Q.value = 1;
    const ng = actx.createGain(); ng.gain.setValueAtTime(0.6, when); ng.gain.setTargetAtTime(0, when, 0.004);
    n.connect(bq); bq.connect(ng); ng.connect(out); n.start(when, Math.random()); n.stop(when + 0.05);

}
const _pv = new V3();
function panOf(p) { _pv.copy(p).applyMatrix4(camera.matrixWorldInverse); return clamp(_pv.x / 3.2, -0.8, 0.8); }
function audioHeardNow() {
  if (!actx) return 0;
  const ts = actx.getOutputTimestamp ? actx.getOutputTimestamp() : null;
  if (ts && ts.contextTime > 0 && ts.performanceTime > 0) return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
  return actx.currentTime - (actx.outputLatency || actx.baseLatency || 0);
}
releaseHook = (k, tStrike, gain) => {
  if (!actx || ffMode) return;
  const when = audioStart + tStrike;
  if (when < actx.currentTime - 0.05) return;
  playBar(k, Math.max(when, actx.currentTime), gain * clamp(bars[k].vn / 3.2, 0.7, 1.2), panOf(bars[k].c));
};
strikeHook = (k, t, vn, gain) => {
  const b = bars[k]; b.ts = t; b.amp = gain;
  const L = strikeLights[slIdx++ % 3]; L.t = t; L.amp = gain; L.l.position.copy(b.c).addScaledVector(b.n, 0.16);
};

/* =====================================================================
   CLOCK, START, LOOP
   ===================================================================== */
const veil = document.getElementById('veil');
let started = false, ffMode = false, perfStart = 0, useAudioClock = false, lastTarget = 0;
async function start() {
  if (started) return; started = true;
  veil.classList.add('gone');
  try {
    initAudio();
    await actx.resume();
    audioStart = actx.currentTime + 0.15;
    master.gain.setValueAtTime(0, actx.currentTime); master.gain.linearRampToValueAtTime(1.15, actx.currentTime + 1.5);
    useAudioClock = actx.state === 'running';
  } catch (e) { console.warn('audio unavailable', e); }
  perfStart = performance.now() / 1000;
  sim.running = true;
}
window.addEventListener('pointerdown', start);
window.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') start(); });
if (window.__clicked) start();

function simTarget() {
  let t;
  if (useAudioClock && actx && actx.state === 'running') t = audioHeardNow() - audioStart;
  else t = performance.now() / 1000 - perfStart - 0.15;
  t = Math.max(lastTarget, t); lastTarget = t; return t;
}

const tmpQ = new THREE.Quaternion();
function spin(m, ang) { if (ang !== 0) { tmpQ.setFromAxisAngle(m.spinAxis, ang); m.mesh.quaternion.premultiply(tmpQ).normalize(); } }
const _n = new V3(), _t = new V3();
function updateMarbleVisuals(dtR) {
  for (const m of marbles) {
    if (m.mode === 'hidden') continue;
    if (m.mode === 'track') {
      const tr = m.track; tr.pos(m.s, m.pos);
      tr.vec(tr.Nn, m.s, _n); tr.vec(tr.T, m.s, _t);
      m.spinAxis.crossVectors(_n, _t).normalize(); m.spinRate = m.v / RM;
    } else if (m.mode === 'lift') {
      const y = liftY(m); m.pos.set(Math.cos(THETA_G) * LIFT_R, y, Math.sin(THETA_G) * LIFT_R);
      m.spinAxis.set(-Math.sin(THETA_G), 0, Math.cos(THETA_G)); m.spinRate = -(sim.liftW * LEAD / TAU) / RM;
    }
    m.mesh.position.copy(m.pos);
    spin(m, m.spinRate * dtR);
  }
}
let lastFrame = performance.now() / 1000, clockT = 0, fxTokens = 4;
const camTarget = new V3(0, 1.72, 0);
function frame() {
  const now = performance.now() / 1000; let dtR = Math.min(0.1, now - lastFrame); lastFrame = now; clockT += dtR;
  const simT0 = sim.t;
  if (sim.running) {
    const target = simTarget();
    let steps = Math.floor((target - sim.t) / DT);
    steps = Math.min(steps, 360 * 2);
    for (let i = 0; i < steps; i++) stepSim();
  }
  const dSim = sim.running ? sim.t - simT0 : 0;
  // camera: an unhurried orbit
  const ca = 0.6 + clockT * TAU / 120, cr = 6.9 + 0.5 * Math.sin(clockT * 0.043), ch = 2.95 + 0.7 * Math.sin(clockT * 0.031 + 1.2);
  camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
  camTarget.set(0, 1.5 + 0.12 * Math.sin(clockT * 0.027), 0);
  const co = window.__camOverride; if (co) { camera.position.set(Math.cos(co.a) * co.r, co.h, Math.sin(co.a) * co.r); camTarget.set(co.tx || 0, co.ty, co.tz || 0); }
  camera.lookAt(camTarget); camera.updateMatrixWorld();
  // incidental sounds from the simulation
  if (actx && !ffMode) {
    const when = actx.currentTime + 0.005;
    fxTokens = Math.min(4, fxTokens + dtR * 14);
    for (const e of fx) {
      if (fxTokens < 1) break;
      fxTokens -= 1;
      if (e.type === 'clack') { const p = e.track.pos(e.s, _v); blip(when, 3100 + Math.random() * 500, 0.012, clamp(e.v * 0.03, 0.004, 0.035), panOf(p), 6500); }
      else if (e.type === 'tock') { _v.set(e.x, e.y, e.z); blip(when, 170 + Math.random() * 40, 0.035, clamp(e.v * 0.05, 0.01, 0.09), panOf(_v), 900); }
      else if (e.type === 'click') { _v.set(e.x, e.y, e.z); blip(when, 3600 + Math.random() * 900, 0.01, clamp(e.v * 0.05, 0.004, 0.04), panOf(_v), 7000); }
      else if (e.type === 'ting') { _v.set(e.x, e.y, e.z); blip(when, 2200 + Math.random() * 300, 0.03, clamp(e.v * 0.03, 0.003, 0.025), panOf(_v), 0); }
      else if (e.type === 'exit') { blip(when, 2600, 0.008, 0.008, 0, 5000); }
    }
    // rolling hush
    let roll = 0, rum = 0;
    for (const m of marbles) { if (m.mode === 'track') roll += Math.abs(m.v); else if (m.mode === 'bowl') rum += Math.hypot(m.vel.x, m.vel.z); }
    rollGain.gain.setTargetAtTime(clamp(roll * 0.0035, 0, 0.03), actx.currentTime, 0.08);
    rumbleGain.gain.setTargetAtTime(clamp(rum * 0.02, 0, 0.09), actx.currentTime, 0.1);
  }

  // visuals
  updateMarbleVisuals(dSim);
  screw.rotation.y = sim.liftA;
  const T = sim.t;
  for (let k = 0; k < N_ARMS; k++) {
    const b = bars[k], age = T - b.ts;
    if (age >= 0 && age < 8) {
      b.mat.emissiveIntensity = b.amp * (1.6 * Math.exp(-age * 9) + 0.55 * Math.exp(-age * 1.4));
      const wob = b.amp * 0.035 * Math.exp(-age * 5.5) * Math.sin(age * TAU * 9);
      b.mesh.quaternion.copy(b.baseQ); b.mesh.rotateX(wob); b.mesh.rotateZ(wob * 0.3);
      b.mesh.position.copy(b.basePos).addScaledVector(b.n, -0.006 * b.amp * Math.exp(-age * 14) * Math.cos(age * TAU * 7));
    } else if (b.mat.emissiveIntensity !== 0) { b.mat.emissiveIntensity = 0; b.mesh.quaternion.copy(b.baseQ); b.mesh.position.copy(b.basePos); }
  }
  for (const L of strikeLights) { const age = T - L.t; L.l.intensity = age >= 0 && age < 4 ? L.amp * 1.1 * Math.exp(-age * 2.6) : 0; }
  for (let k = 0; k < N_ARMS; k++) {
    const age = T - gates[k].tOpen;
    const o = age >= 0 ? sstep(0, 0.05, age) * (1 - sstep(0.12, 0.22, age)) : 0;
    gateMeshes[k].rotation.z = o * 1.25;
  }
  dust.material.uniforms.time.value = clockT; window.__shaft.material.uniforms.time.value = clockT;
  finish.uniforms.time.value = clockT;
  finish.uniforms.fade.value = Math.min(1, clockT / 2.5);
  composer.render();
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
updateMarbleVisuals(0);
requestAnimationFrame(frame);

// diagnostics for testing
window.__mm = {
  stats, sim, barInfo, bars, ramps, rels, T_HIT, travel, queues, buffer, liftList,
  info: () => ({ gateY: GATE_Y, lip: barInfo.map(b => b.lipY.toFixed(2)), T: T_HIT.map(t => t.toFixed(3)), land: barInfo.map(b => b.land.toFixed(2) + b.mode), marbles: marbles.length, travel: travel.map(t => t.toFixed(2)), bars: bars.map(b => [Math.hypot(b.c.x, b.c.z).toFixed(2), b.c.y.toFixed(2), b.vn.toFixed(2)]) }),
  async renderAudio(sec) {
    const oc = new OfflineAudioContext(2, 44100 * sec, 44100); initAudio(oc); master.gain.value = 0.9;
    for (const r of rels) if (r.t < sec - 1) playBar(r.bar, r.t, r.gain, 0);
    const buf = await oc.startRendering(); const d = buf.getChannelData(0);
    let pk = 0, ss = 0; for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > pk) pk = v; ss += v * v; }

    for (let i = 0; i < d.length; i++) { out[2 * i] = clamp(d[i], -1, 1) * 32767; out[2 * i + 1] = clamp(d1[i], -1, 1) * 32767; }

  info2: () => renderer.info.render,
  fastForward(sec) { ffMode = true; sim.running = false; const n = Math.round(sec / DT); for (let i = 0; i < n; i++) stepSim(); fx.length = 0; ffMode = false; return { ...stats, t: sim.t, buffer: buffer.length, lift: liftList.length, q: queues.map(q => q.length), modes: marbles.reduce((a, m) => (a[m.mode] = (a[m.mode] || 0) + 1, a), {}) }; },
};
